[build-system]
requires = ["setuptools>=69", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-agentic"
description = "Provider-agnostic, schema-driven tools, agents, and composable workflows for building agentic systems."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dynamic = ["version"]

authors = [{ name = "gearsngenes" }]
keywords = ["agents", "workflows", "composites", "pipelines", "graphs", "routing", "tools", "LLM", "RAG", "MCP", "A2A"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "Development Status :: 3 - Alpha"
]

# Core: protocol/transport libraries only. No LLM provider SDKs.
dependencies = [
  "mcp>=1.25,<3",
  "a2a-sdk[grpc]>=1.1.2,<2",
  "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
# Provider SDKs (one extra per engine).
openai    = ["openai>=2.45,<4"]
anthropic = ["anthropic>=0.116.0,<3"]
gemini    = ["google-genai>=2.10.0,<4"]
mistral   = ["mistralai>=2.6.0,<4"]
litellm   = ["litellm>=1.108,<3"]
llama = [
  "llama-cpp-python>=0.3.16,<0.4",
  "huggingface-hub>=1.5,<3",
]

# Every LLM provider (llama-cpp-python builds from source).
all_llm = ["atomic-agentic[openai,anthropic,gemini,mistral,litellm,llama]"]

# Development / test tooling only. Not required at runtime.
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "a2a-sdk[http-server]>=1.1.2,<2",
]

# Deprecated: removed in the final 2.0.0 release.
python-a2a = ["python-a2a>=0.5.10,<0.6"]

# python-a2a plus the test tooling.
extras = ["atomic-agentic[python-a2a,dev]"]

[project.urls]
Homepage = "https://github.com/gearsngenes/Atomic-Agentic"
Issues   = "https://github.com/gearsngenes/Atomic-Agentic/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atomic_agentic = ["py.typed"]

[tool.setuptools_scm]
version_file = "src/atomic_agentic/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --basetemp=.pytest_tmp"
tmp_path_retention_policy = "none"
markers = [
  "integration: multi-component integration tests",
  "llm: tests that make real LLM API calls",
  "network: tests that require network access",
  "slow: tests with long runtimes",
]
norecursedirs = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
  "examples",
  "test_code",
]

[tool.coverage.run]
source = ["atomic_agentic"]
branch = true
omit = [
    "*/atomic_agentic/_version.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "pragma: no cover",
]
omit = [
    "*/atomic_agentic/_version.py",
]